<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제목</title>

    <style>
        div {
            background: #f00;
            width: 400px;
            height: 400px;
            margin-top: 40px;
            margin-bottom: 40px;
            /* margin - 겹치면 더 큰 값이 덮는다 */
            padding-left: 40px;
            padding-right: 40px;

            border: 1px solid #333;
        }

        span,
        a {
            background: #ff0;
            width: 400px;
            height: 400px;
            /* inline tag 크기 안먹음 */
            margin-top: 40px;
            margin-bottom: 40px;

            padding-left: 40px;
            padding-right: 40px;
            /* inline tag는 margin,padding 좌우로만 먹는다 */
            padding-top: 40px;
            padding-bottom: 40px;
            /* padding top,bottom은 실질적으로 먹진 않았지만 먹은것처럼 보인다 */
        }
    </style>
</head>

<body>
    <div>box</div>
    <div>box</div>

    <span>inline</span>
    <span>inline</span>
    <a href="">inline</a>
</body>

</html>
